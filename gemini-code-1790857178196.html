<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MSH – Media. Social. Hub. | Wir bauen um</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbf8f2;
  --ink: #133252;
  --accent: #60a9e6;
  --sand: #efddc4;
  --grey: #cecdcd;
  --ground: #133252;
  --card: transparent;
  --skin: #e3b48c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d2239;
    --ink: #efddc4;
    --ground: #60a9e6;
    --card: #fff;
  }
}
:root[data-theme="dark"] {
  --bg: #0d2239;
  --ink: #efddc4;
  --ground: #60a9e6;
  --card: #fff;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  overflow-x: hidden;
}
main {
  width: 100%;
  max-width: 900px;
  margin: auto;
  padding: 40px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.logo {
  background: var(--card);
  border-radius: 18px;
  padding: 10px 18px;
  margin-bottom: 8px;
}
.logo img {
  display: block;
  width: min(240px, 60vw);
  height: auto;
  margin: 0 auto;
}
.badge {
  margin-top: 16px;
  display: inline-block;
  font-weight: 500;
  font-size: .75rem;
  letter-spacing: .2em;
  text-transform: uppercase;
  padding: 6px 14px;
  border-radius: 99px;
  background: var(--sand);
  color: #133252;
}
h1 {
  font-weight: 800;
  font-size: clamp(2rem, 5vw, 3.2rem);
  line-height: 1.1;
  margin: 16px 0 10px;
  letter-spacing: -.02em;
}
h1 span { color: var(--accent); }
p.lead {
  max-width: 500px;
  margin: 0 auto;
  font-size: clamp(0.95rem, 2vw, 1.1rem);
  line-height: 1.5;
  opacity: .85;
}
.prog {
  width: min(380px, 80%);
  margin: 24px auto 0;
}
.prog small {
  display: flex;
  justify-content: space-between;
  font-size: .7rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  font-weight: 500;
  margin-bottom: 6px;
}
.bar {
  height: 8px;
  border-radius: 8px;
  background: var(--grey);
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  width: 72%;
  border-radius: 8px;
  background: var(--accent);
  animation: grow 3s ease-out both;
}
@keyframes grow { from { width: 8%; } }
.scene {
  width: 100%;
  max-width: 760px;
  margin-top: 36px;
}
svg {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}
.hit { transform-origin: 0 0; animation: hit .7s ease-in-out infinite alternate; }
@keyframes hit { from { transform: rotate(-70deg); } to { transform: rotate(15deg); } }
.roll { transform-origin: 0 0; animation: roll 1.6s ease-in-out infinite alternate; }
@keyframes roll { from { transform: rotate(-35deg); } to { transform: rotate(-5deg); } }
.paint { transform-box: view-box; transform-origin: 392px 0; animation: paint 3.2s ease-in-out infinite; }
@keyframes paint { 0% { transform: scaleX(.03); } 70%, 100% { transform: scaleX(1); } }
.type { transform-origin: 0 0; animation: type .25s ease-in-out infinite alternate; }
@keyframes type { from { transform: rotate(-4deg); } to { transform: rotate(5deg); } }
.swing { transform-origin: 0 0; animation: swing 3.4s ease-in-out infinite alternate; }
@keyframes swing { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
.bob { animation: bob .7s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-3px); } }
.blink { animation: blink 1.2s steps(2) infinite; }
@keyframes blink { 50% { opacity: .45; } }
.spark { opacity: 0; animation: spark .7s linear infinite; }
@keyframes spark { 0%, 70% { opacity: 0; } 85% { opacity: 1; } 100% { opacity: 0; } }
footer {
  width: 100%;
  text-align: center;
  padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
  font-size: .75rem;
  letter-spacing: .12em;
  background: var(--ground);
  color: var(--bg);
  font-weight: 500;
}
footer b { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<main>
  <div class="logo">
    <img alt="MSH – Media. Social. Hub." src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAoAAAADoCAYAAAB/9VU9AACSw0lEQVR42uydd3hcxdXG33Pm3t2VZFlWcZE7HQwusuglBhISQrElGrvKYGKbKCVXW7Mh110023K1K0L4WwFauo17W5X3d33e98f02f928z44y2Q5t2d/v063c/v2133T3j3O7q7t02J1M9B4u4zM+t+b86c3vuvv293297a7r9p3h9wM6TqGAAAAABJRU5ErkJggg==">
  </div>
  <span class="badge">Baustelle · Neue Website</span>
  <h1>Hier wird <span>gebaut.</span></h1>
  <p class="lead">Unsere neue Website ist in Arbeit. Das Team gibt gerade Vollgas – schau bald wieder vorbei.</p>
  
  <div class="prog">
    <small><span>Baufortschritt</span><span>72&nbsp;%</span></small>
    <div class="bar"><i></i></div>
  </div>

  <div class="scene">
    <svg viewBox="0 0 900 300" role="img" aria-label="Animierte Bauarbeiter bauen die neue Website">
      <defs>
        <g id="man"><rect x="-11" y="-42" width="9" height="42" rx="3" fill="#133252"/><rect x="2" y="-42" width="9" height="42" rx="3" fill="#133252"/>
          <rect x="-15" y="-88" width="30" height="50" rx="8" fill="#60a9e6"/><rect x="-15" y="-62" width="30" height="6" fill="#efddc4"/>
          <circle cy="-102" r="12" fill="#e3b48c"/><path d="M-14-104a14 14 0 0 1 28 0z" fill="#133252"/><rect x="-17" y="-106" width="34" height="5" rx="2.5" fill="#133252"/></g>
      </defs>
      <!-- Gerüst -->
      <g stroke="#133252" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M350 270V100M570 270V100M350 190h220M350 100h220M350 270L570 190M570 270L350 190"/></g>
      <rect x="340" y="184" width="240" height="8" rx="3" fill="#60a9e6"/>
      <!-- Schild mit Farbstreifen -->
      <rect x="392" y="108" width="150" height="62" rx="5" fill="#fbf8f2" stroke="#133252" stroke-width="4"/>
      <rect class="paint" x="392" y="120" width="150" height="14" fill="#60a9e6"/>
      <rect class="paint" x="392" y="142" width="110" height="14" fill="#133252" style="animation-delay:.4s"/>
      <!-- Boden -->
      <rect x="-20" y="270" width="940" height="40" fill="var(--ground)"/>
      <!-- Arbeiter 1: Hammer -->
      <g transform="translate(130 270)"><use href="#man"/>
        <g transform="translate(0 -78)"><g class="hit"><rect x="-4" y="0" width="8" height="34" rx="4" fill="#60a9e6" transform="rotate(-90) rotate(90)"/>
          <rect x="-4" y="0" width="8" height="30" rx="4" fill="#e3b48c" transform="translate(0 0)"/><rect x="-14" y="26" width="28" height="14" rx="3" fill="#cecdcd"/></g></g></g>
      <rect x="175" y="244" width="44" height="26" rx="3" fill="#efddc4" stroke="#133252" stroke-width="3"/>
      <g fill="#60a9e6"><circle class="spark" cx="190" cy="236" r="3"/><circle class="spark" cx="205" cy="228" r="2.5" style="animation-delay:.2s"/><circle class="spark" cx="214" cy="238" r="2" style="animation-delay:.1s"/></g>
      <!-- Arbeiter 2: Maler auf Gerüst -->
      <g transform="translate(460 184)"><use href="#man"/>
        <g transform="translate(0 -78)"><g class="roll"><rect x="-4" y="0" width="8" height="30" rx="4" fill="#e3b48c"/><rect x="-24" y="26" width="48" height="12" rx="6" fill="#60a9e6"/></g></g></g>
      <!-- Arbeiter 3: Laptop -->
      <g transform="translate(720 270)"><g class="bob"><use href="#man"/></g>
        <rect x="18" y="-50" width="36" height="50" rx="3" fill="#efddc4" stroke="#133252" stroke-width="3"/>
        <g transform="translate(18 -68)"><rect x="0" y="0" width="40" height="26" rx="3" fill="#133252"/><rect class="blink" x="4" y="4" width="32" height="18" rx="2" fill="#60a9e6"/></g>
        <g transform="translate(0 -74)"><g class="type"><rect x="-4" y="0" width="8" height="34" rx="4" fill="#e3b48c" transform="rotate(-62)"/></g></g></g>
      <!-- Kran mit Logo-Ring -->
      <g stroke="#133252" stroke-width="7" stroke-linecap="round"><path d="M830 270V40M830 40H560M830 40L790 14H560"/><path stroke-width="3" d="M830 270L800 230M830 200L800 160M830 130L800 90"/></g>
      <rect x="552" y="30" width="22" height="20" rx="3" fill="#60a9e6"/>
      <g transform="translate(640 40)"><g class="swing"><path d="M0 0V120" stroke="#133252" stroke-width="3"/>
        <circle cy="150" r="30" fill="none" stroke="#60a9e6" stroke-width="13"/><circle cy="150" r="11" fill="#133252"/></g></g>
    </svg>
  </div>
</main>
<footer><b>SOCIAL.</b></footer>
</body>
</html>
